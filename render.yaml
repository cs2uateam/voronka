services:
  - type: web
    name: voronka-cs2uateam
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --bind 0.0.0.0:$PORT --timeout 90
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JSONBIN_BIN_ID
        sync: false
      - key: JSONBIN_AUTH_BIN_ID
        sync: false
      - key: JSONBIN_MASTER_KEY
        sync: false
